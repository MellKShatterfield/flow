.journal-card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:19px;margin:10px 0 13px}
.journal-card h3{margin:0 0 4px}
.kcal-row{display:flex;align-items:center;gap:10px}
.kcal-row .num{font:400 24px/1.2 Georgia,serif}
.kcalbar{margin-top:8px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.calhead h3{font:400 17px/1.2 Georgia,serif;text-transform:capitalize;margin:0}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.calgrid .day{min-height:44px;border-radius:12px;border:1px solid #dedfce;background:#faf8f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;padding:4px 2px}
.calgrid .day small{font-size:9px;color:var(--muted)}
.calgrid .day.within{background:#e3ead8;border-color:#c4d0b3;color:#4b5c3c}
.calgrid .day.over{background:#e9e3ef;border-color:#c4b8d1;color:#665776}
.calgrid .day.none{background:#eeece7}
.calgrid .day.today{box-shadow:inset 0 0 0 1px #839474}
.callegend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--muted)}
.callegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#d1ddc0}
.callegend i.over{background:#c7b9d4}.callegend i.empty{background:#e7e3d9}
.vorlagen{margin-top:18px}
.vorlagen-toggle{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer}
.vorlagen-toggle:hover{border-color:var(--sage)}
.vorlagen-toggle .chev{font-size:18px;color:var(--muted)}
.vorlagen-list{margin-top:10px;display:grid;gap:8px}
.vorlagen .tpl{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:18px}
.vorlagen .tpl .tile{width:38px;height:38px;font-size:17px}

.settings-head{padding:4px 2px 10px}.settings-head h2{margin:5px 0}.settings-card{margin:12px 0;padding:17px}.settings-card h3{margin:0 0 10px}.setting-toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid var(--line)}.setting-toggle span{display:grid;gap:3px}.setting-toggle small{color:var(--muted);font-size:12px}.setting-toggle input{width:20px;height:20px;accent-color:#7c8b6f;flex:0 0 auto}.palette-preview{display:flex;gap:7px;margin:13px 0 16px}.palette-preview span{width:32px;height:32px;border-radius:50%;border:1px solid #00000012}.settings-card select.field{width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:inherit}
.mood-stats-launch{display:flex;align-items:center;justify-content:space-between;gap:14px}.mood-stats-launch h3{margin:5px 0}.mood-stat-row{display:grid;grid-template-columns: minmax(95px,1fr) 2fr 24px;gap:9px;align-items:center;font-size:11px;margin:12px 0}.mood-stat-track{height:9px;border-radius:10px;background:#e8e9df;overflow:hidden}.mood-stat-track i{height:100%;display:block;background:#8fa681;border-radius:10px}.mood-chart{height:170px;display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:10px 2px 0}.mood-chart-col{height:100%;min-width:25px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}.mood-chart-col i{width:100%;max-width:28px;min-height:5px;border-radius:8px 8px 3px 3px}.mood-chart-col small{font-size:9px;white-space:nowrap}

.moodhero-main{position:relative;text-align:left;padding:23px 20px 19px;background:linear-gradient(135deg,#e5ecdf 0%,#f1eee4 100%);border:1px solid #d9e2d0;box-shadow:0 8px 24px #59694a0b}
.moodhero-main:after{content:' ';position:absolute;right:-34px;top:-45px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#ffffff78 0 35%,#ffffff00 70%);pointer-events:none}
.moodhero-main h2{font-size:27px;margin:7px 0 5px;position:relative;z-index:1}
.moodhero-main>.help{max-width:440px;margin:0 0 10px;position:relative;z-index:1}
.moodhero-main .faces{position:relative;z-index:1;gap:7px;margin:13px 0 8px}
.moodhero-main .face{padding:9px 3px 7px;border-radius:19px;background:#fffcf77a;border:1px solid #ffffff9c;transition:background .15s,border-color .15s,transform .15s}
.moodhero-main .face svg{width:46px;height:46px}
.moodhero-main .face .label{font-size:10px;font-weight:600;color:#58634f;min-height:25px}
.moodhero-main .face.selected{background:#fffdf8;border-color:#91a383;box-shadow:0 3px 10px #59694a14;transform:translateY(-2px)}
.moodhero-main>.pill{position:relative;z-index:1;margin-top:8px;min-width:190px}
.mood-overview{gap:10px;margin-bottom:18px}
.mood-overview .card{display:flex;align-items:center;gap:12px;padding:14px 15px;border:1px solid #e6e6d9;box-shadow:0 4px 16px #59694a08}
.mood-overview .mood-overview-icon{width:37px;height:37px;border-radius:14px;background:#e9eee2;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.mood-overview .stat b{display:block;font:500 23px/1.1 Georgia,serif;color:#43563c}
.mood-overview .stat small{display:block;margin-top:4px;line-height:1.3}
.sectionhead.mood-sectionhead{margin:22px 2px 11px;align-items:end}
.sectionhead.mood-sectionhead h3{font:400 20px/1.2 Georgia,serif;margin:0}
.sectionhead.mood-sectionhead small{font-size:11px}
.daycard{position:relative;overflow:hidden;background:var(--paper);border:1px solid #e8e7dc;border-radius:20px;padding:15px 16px;margin-bottom:10px;box-shadow:0 4px 15px #59694a08}
.daycard:before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 4px 4px 0;background:#b8c7a9}
.daycard .row{padding-left:3px}
.daycard .row>span:first-child svg{width:43px;height:43px}
.daycard .row b{font-size:14px;color:#3e4d38}
.daycard .daysegment{display:flex;gap:8px;align-items:baseline;padding:8px 2px 0;margin-top:7px;border-top:1px solid #efeee7;font-size:11px;line-height:1.45}
.daycard .daysegment .label{min-width:90px;max-width:90px;font-size:10px;color:#7b8373}
.daycard>p{margin:11px 2px 1px;padding:10px 12px;border-radius:13px;background:#f5f3ec;font:italic 13px/1.5 Georgia,serif;color:#59634f}
.daycard.mood-level-1:before{background:#839b83}.daycard.mood-level-2:before{background:#9eae8e}.daycard.mood-level-3:before{background:#b5bd91}.daycard.mood-level-4:before{background:#c7b98e}.daycard.mood-level-5:before{background:#d0aa83}
.mood-cal-wrap{padding:18px 16px 16px;background:var(--paper);border:1px solid #e7e6da;border-radius:24px;box-shadow:0 5px 18px #59694a08}

function taskDayStats(d){let dueItems=db.entries.filter(e=>!e.archived&&(e.type==='habit'?due(e,d)&&!activeFor(e,d).length:e.type==='todo'&&(e.date||today())<=d));let completed=dueItems.filter(e=>done(e,d)||e.type==='todo'&&todoDate(e)===d).length;return {total:dueItems.length,completed,all:dueItems.length>0&&completed===dueItems.length}}

function taskCalendarHTML(){let [y,m]=calMonth.split('-').map(Number),first=new Date(y,m-1,1,12),last=new Date(y,m,0,12),offset=(first.getDay()+6)%7,cells='<span></span>'.repeat(offset);for(let i=1;i<=last.getDate();i++){let d=date(new Date(y,m-1,i,12)),st=taskDayStats(d),future=d>today();cells+=`<button type="button" class="taskcal-day ${st.all?'done-day':''} ${d===today()?'today':''}" data-act="task-day" data-date="${d}" ${future?'disabled':''} aria-label="${dateLabel(d)}: ${st.completed} von ${st.total} erledigt"><b>${i}</b><small>${st.total?st.completed+'/'+st.total:'–'}</small></button>`}return `<section class="task-calendar"><div class="eyebrow">Dein Aufgabenrhythmus</div><div class="row between"><h3 class="taskcal-title">Task Planer</h3><span class="muted">Erledigte Aufgaben</span></div><div class="row between" style="margin-top:8px">${btn('task-month','‹',`data-value="-1" aria-label="Voriger Monat"`,'iconbutton')}<span class="taskcal-month">${first.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</span>${btn('task-month','›',`data-value="1" aria-label="Nächster Monat" ${calMonth>=today().slice(0,7)?'disabled':''}`,'iconbutton')}</div><div class="taskcal-grid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<small>${x}</small>`).join('')}${cells}</div><p class="help">Die Zahlen zeigen erledigte Aufgaben im Verhältnis zu den geplanten Aufgaben des Tages. Leere Tage bleiben neutral.</p></section>`}
function todayPlannerHTML(){let mode=db.settings.todayPlannerMode||'tasks';return `<div class="planner-switch" role="group" aria-label="Planer auswählen">${btn('today-planner','Task Planer',`data-mode="tasks" aria-pressed="${mode==='tasks'}"`,mode==='tasks'?'pill primary':'pill')}${btn('today-planner','Essenskalender',`data-mode="kcal" aria-pressed="${mode==='kcal'}"`,mode==='kcal'?'pill primary':'pill')}</div>${mode==='kcal'?(db.settings.kcalPlanner!==false?kcalCalendarHTML():`<section class="task-calendar"><p class="help">Der kcal-Planer ist in den Einstellungen ausgeschaltet.</p></section>`):taskCalendarHTML()}`}
function taskCompletionData(period){let now=parse(today()),from,to,labels=[];if(period==='week'){let monday=new Date(now);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));from=date(monday);to=today();for(let i=0;i<7;i++){let d=shift(from,i);labels.push({key:d,label:parse(d).toLocaleDateString('de-DE',{weekday:'short'})})}}else if(period==='month'){from=today().slice(0,7)+'-01';to=today();let count=Math.ceil((parse(to)-parse(from))/86400000)+1;for(let i=0;i<count;i+=7){let d=shift(from,i);labels.push({key:d,label:'W'+(Math.floor(i/7)+1)})}}else{from=today().slice(0,4)+'-01-01';to=today();for(let i=0;i<12;i++){let d=today().slice(0,4)+'-'+String(i+1).padStart(2,'0')+'-01';labels.push({key:d,label:parse(d).toLocaleDateString('de-DE',{month:'short'})})}}let countFor=(a,b)=>{let n=0;for(let e of db.entries.filter(e=>!e.archived)){if(e.type==='todo'){let completed=Object.entries(db.logs[e.id]||{}).some(([d,v])=>d>=a&&d<=b&&v>=1);if(completed)n++;continue}for(let d=a;d<=b;d=shift(d,1)){if(done(e,d)&&d>=e.created){n++;}}}return n};let vals=labels.map((x,i)=>{let a=x.key,b=period==='week'?a:period==='month'?shift(a,6):x.key.slice(0,7)+'-'+String(new Date(+x.key.slice(0,4),+x.key.slice(5,7),0).getDate()).padStart(2,'0');if(period==='year')a=x.key;return {...x,value:countFor(a,b)}});return {from,to,vals,total:countFor(from,to)}}
function taskProgressHTML(){let period=db.settings.taskProgressPeriod||'week',data=taskCompletionData(period),total=data.total,labels=period==='week'?['Wöchentlich','Monatlich','Jährlich']:period==='month'?['Wöchentlich','Monatlich','Jährlich']:['Wöchentlich','Monatlich','Jährlich'],max=Math.max(1,...data.vals.map(x=>x.value));return `<section class="progress-panel"><div class="eyebrow">Deine Leistungen</div><h2 style="margin:5px 0">Dein Fortschritt</h2><div class="progress-total">${total}</div><div class="muted">Erledigte Aufgaben im gewählten Zeitraum</div><div class="progress-metrics">${[['week','Diese Woche'],['month','Dieser Monat'],['year','Dieses Jahr']].map(([k,label])=>{let n=taskCompletionData(k).total;return `<div class="progress-metric"><b>${n}</b><small>${label}</small></div>`}).join('')}</div><div class="progress-period">${[['week','Woche'],['month','Monat'],['year','Jahr']].map(([k,label])=>btn('task-progress-period',label,`data-period="${k}" aria-pressed="${period===k}"`,period===k?'pill primary':'pill')).join('')}</div><div class="progress-bars">${data.vals.map(x=>`<div class="progress-bar-col" title="${x.label}: ${x.value}"><i style="height:${Math.max(3,x.value/max*100)}%"></i><small>${x.label}</small></div>`).join('')}</div><div class="progress-compare">${period==='week'?'Erledigungen pro Wochentag':period==='month'?'Erledigungen pro Kalenderwoche':'Erledigungen pro Monat'} · Deine Entwicklung ohne Wettbewerb.</div></section>`}

document.addEventListener('change',async ev=>{let t=ev.target,f=t.closest('form');try{if(t.id==='mood-month-jump'){if(/^\d{4}-\d{2}$/.test(t.value)&&t.value<=today().slice(0,7)){moodMonth=t.value;render()}return}if(f?.dataset.form==='entry'){if(t.name==='track'){$('#entry-subbox').hidden=t.value!=='checklist';$('#entry-targetbox').hidden=!['amount','duration'].includes(t.value);if(t.value==='duration')f.elements.unit.value='Min.'}if(t.name==='repeat'){$('#entry-daysbox').hidden=t.value!=='custom';$('#entry-intervalbox').hidden=t.value!=='interval'}}if(f?.dataset.form==='project'&&t.name==='kind')$('#project-random').hidden=t.value==='timeline';if(t.id==='photo'){let file=t.files[0],ref=f,c=ctx;if(!file)return;c.busy=true;f.querySelector('[type="submit"]').disabled=true;$('#photo-status').textContent='Dein Bild wird vorbereitet …';try{let data=await readPhoto(file);if(!ref.isConnected)return;bg.image=data;bg.mode='photo';previewBackground();$('#photo-status').textContent='Dein Bild ist bereit. Mit Speichern übernehmen.'}catch(e){if(ref.isConnected)$('#photo-status').textContent=e.message}finally{c.busy=false;if(ref.isConnected)ref.querySelector('[type="submit"]').disabled=false}}if(t.id==='backup-file'){let file=t.files[0];if(!file)return;let candidate=normalize(JSON.parse(await file.text()));if(!confirm('Import ersetzt den lokalen Stand dieser Adresse. Hast du ihn vorher gesichert?'))return;let old=db,fault=storageFault;db=candidate;storageFault=false;award();if(!persist()){db=old;storageFault=fault;return}closeDialog();$('#startup-error').hidden=true;render();toast('Backup importiert. Bitte deine Einträge kontrollieren.')}}catch(e){toast('Datei konnte nicht übernommen werden: '+e.message)}});
function finishDrag(cancel=false){if(!drag)return;let d=drag;drag=null;cancelAnimationFrame(d.raf);d.ghost.remove();d.row.classList.remove('drag-source');if(cancel)render();else change(()=>saveOrder(d.group.dataset.kind,[...d.group.children].map(e=>e.dataset.entry).filter(Boolean)))}function drawDrag(){if(!drag)return;let d=drag;d.ghost.style.left=d.left+'px';d.ghost.style.top=(d.y-d.offset)+'px';let hit=document.elementFromPoint(d.x,d.y)?.closest('[data-entry]');if(hit&&hit!==d.row&&hit.parentElement===d.group){let r=hit.getBoundingClientRect();d.group.insertBefore(d.row,d.y<r.top+r.height/2?hit:hit.nextSibling)}if(d.y<90)window.scrollBy(0,-9);else if(d.y>window.innerHeight-100)window.scrollBy(0,9);d.raf=requestAnimationFrame(drawDrag)}
document.addEventListener('pointerdown',ev=>{let b=ev.target.closest('[data-act="grip"]');if(!b||!sorting||drag||ev.button!==0)return;let row=b.closest('[data-entry]'),group=row.parentElement,r=row.getBoundingClientRect(),ghost=row.cloneNode(true);ghost.removeAttribute('data-entry');ghost.classList.add('drag-ghost');ghost.setAttribute('aria-hidden','true');ghost.style.width=r.width+'px';document.body.append(ghost);row.classList.add('drag-source');drag={row,group,ghost,x:ev.clientX,y:ev.clientY,offset:ev.clientY-r.top,left:r.left,pointer:ev.pointerId,raf:0};b.setPointerCapture(ev.pointerId);ev.preventDefault();drawDrag()});document.addEventListener('pointermove',ev=>{if(drag&&drag.pointer===ev.pointerId){drag.x=ev.clientX;drag.y=ev.clientY;ev.preventDefault()}},{passive:false});document.addEventListener('pointerup',ev=>{if(drag?.pointer===ev.pointerId)finishDrag()});document.addEventListener('pointercancel',()=>finishDrag(true));
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(drag)finishDrag(true);else if(!$('#modal').hidden)closeDialog();return}let grip=ev.target.closest('[data-act="grip"]');if(grip&&['ArrowUp','ArrowDown'].includes(ev.key)){ev.preventDefault();let group=grip.closest('.entry-list'),ids=[...group.children].map(e=>e.dataset.entry),i=ids.indexOf(grip.dataset.id),j=i+(ev.key==='ArrowUp'?-1:1);if(j>=0&&j<ids.length){[ids[i],ids[j]]=[ids[j],ids[i]];change(()=>saveOrder(group.dataset.kind,ids));[...document.querySelectorAll('[data-act="grip"]')].find(b=>b.dataset.id===grip.dataset.id)?.focus()}return}if(ev.key==='Enter'&&ev.target.name?.startsWith('custom-')&&ctx?.kind==='mood'){ev.preventDefault();addMoodTag(ev.target.name.slice(7));return}if(ev.key==='Tab'&&!$('#modal').hidden){let a=[...$('.sheet').querySelectorAll('button,input,select,textarea,summary')].filter(x=>x.getClientRects().length&&!x.disabled),first=a[0],last=a.at(-1);if(ev.shiftKey&&document.activeElement===first){last?.focus();ev.preventDefault()}else if(!ev.shiftKey&&document.activeElement===last){first?.focus();ev.preventDefault()}}});$('#modal').addEventListener('click',ev=>{if(ev.target===$('#modal'))closeDialog()});let visibleDay=today();document.addEventListener('visibilitychange',()=>{if(document.hidden){if(drag)finishDrag(true)}else{visibleDay=today();render()}});setInterval(()=>{if(today()!==visibleDay&&!drag){visibleDay=today();render()}},60000);
try{let raw=localStorage.getItem(KEY);if(raw){db=normalize(JSON.parse(raw));try{if(!localStorage.getItem('flow_pre_updateD'))localStorage.setItem('flow_pre_updateD',raw)}catch(e){}}else db=blank();let n=Object.keys(db.badges).length;award();if(Object.keys(db.badges).length!==n)persist();render()}catch(e){storageFault=true;db=blank();try{render()}catch(other){}window.flowFailure(e)}if(location.protocol==='https:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});

document.addEventListener('submit',ev=>{try{let f=ev.target;if(f.dataset.form==='kcal'){ev.preventDefault();let d=f.dataset.date,mode=f.elements.mode.value,amt=Math.round(+f.elements.amount.value);if(!(amt>=0&&amt<=100000))return;change(()=>{let k=kcalHabit();let old=db.logs[k.id]?.[d]||0;db.logs[k.id][d]=mode==='set'?amt:old+amt});closeDialog();toast('Tagesstand gespeichert')}else if(f.dataset.form==='food-template'){ev.preventDefault();let name=f.elements.name.value.trim(),goal=Math.round(+f.elements.goal.value);if(!name||!(goal>0&&goal<=100000)){let e=$('#food-err');e.hidden=false;e.textContent='Bitte Name und ein positives, ganzzahliges Maximum eingeben.';return}change(()=>{let k=kcalHabit();if(k){k.name=name;k.goal=goal}else db.entries.push({id:uid(),type:'habit',name,icon:'◷',color:'#A9B99C',track:'amount',goal,unit:'kcal',subtasks:[],days:[],created:today()})});closeDialog();render();toast('kcal-Gewohnheit gespeichert')}}catch(e){window.flowFailure(e)}});
document.addEventListener('input',ev=>{try{let t=ev.target;if(t.dataset?.journal){let d=today();db.journal[d]=db.journal[d]||{};db.journal[d][t.dataset.journal]=t.value;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}let s=$('#journal-save-state');if(s)s.textContent='✓ Für heute gespeichert'}}catch(e){window.flowFailure(e)}});
</script></body></html>
